<style>
  :root {
    --fg:#1d1d1f; --muted:#6e6e73; --accent:#0a84ff; --accent2:#5e9bff;
    --glass:rgba(255,255,255,.52); --glass-solid:rgba(250,251,255,.94); --glass-line:rgba(255,255,255,.72); --glass-hi:rgba(255,255,255,.95);
    --inner:rgba(255,255,255,.58); --inner-line:rgba(60,70,100,.14); --shadow:0 10px 40px rgba(40,60,120,.14), 0 1px 3px rgba(40,60,120,.08);
    --ok:#30b350; --warn:#ff9f0a; --bad:#ff453a; --bar:rgba(10,132,255,.78);
    --bg1:#e8eeff; --bg2:#f4e9ff; --bg3:#ffe9f2; --r:26px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg:#f5f5f7; --muted:#a1a1a6; --accent:#2f93ff; --accent2:#6aa9ff;
      --glass:rgba(34,38,54,.52); --glass-solid:rgba(28,31,44,.95); --glass-line:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.2);
      --inner:rgba(255,255,255,.07); --inner-line:rgba(255,255,255,.14); --shadow:0 12px 44px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
      --ok:#32d74b; --warn:#ffb340; --bad:#ff6961; --bar:rgba(47,147,255,.85);
      --bg1:#0b0e17; --bg2:#10122a; --bg3:#161024;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; min-height:100vh; color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3)); background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  /* やわらかく動く背景の光 */
  .bg { position:fixed; inset:0; overflow:hidden; z-index:-1; pointer-events:none; }
  .bg i { position:absolute; border-radius:50%; filter:blur(80px); opacity:.55; animation:float 26s ease-in-out infinite alternate; }
  .bg .b1 { width:46vw; height:46vw; left:-10vw; top:-14vw; background:#69b8ff; }
  .bg .b2 { width:40vw; height:40vw; right:-8vw; top:10vh; background:#ff9ccd; animation-duration:32s; animation-delay:-8s; }
  .bg .b3 { width:38vw; height:38vw; left:28vw; bottom:-18vw; background:#8ee9c4; animation-duration:29s; animation-delay:-14s; }
  @media (prefers-color-scheme: dark) { .bg i { opacity:.32; } .bg .b1 { background:#1f5fff; } .bg .b2 { background:#8b3dff; } .bg .b3 { background:#00a89a; } }
  @keyframes float { from { transform:translate3d(0,0,0) scale(1); } to { transform:translate3d(6vw,4vh,0) scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .bg i { animation:none; } * { transition:none !important; animation:none !important; } }

  /* ガラス */
  .glass {
    background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--r);
    -webkit-backdrop-filter:blur(30px) saturate(170%); backdrop-filter:blur(30px) saturate(170%);
    box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) { .glass { background:var(--glass-solid); } }

  /* 全体の配置: 左にGAKU acct、右に項目 (横に広がる) */
  .shell { display:grid; grid-template-columns:440px minmax(0,1fr); gap:22px; max-width:1560px; margin:0 auto; padding:24px; transition:grid-template-columns .5s cubic-bezier(.2,.8,.2,1); }
  .shell.solo { grid-template-columns:440px; justify-content:center; align-content:center; min-height:100vh; }
  .left { position:sticky; top:24px; align-self:start; display:grid; gap:14px; }
  .brand { display:flex; align-items:center; gap:10px; padding:0 6px; font-weight:700; font-size:1.35rem; letter-spacing:-.01em; }
  .brand img { width:34px; height:34px; border-radius:9px; box-shadow:0 2px 10px rgba(10,132,255,.35); }
  .acct { padding:10px; }
  .acct iframe { display:block; margin:0 auto; }
  .stage { min-width:0; display:flex; flex-direction:column; gap:16px; min-height:calc(100vh - 48px); animation:rise .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.99); } to { opacity:1; transform:none; } }

  /* 右上の「＋」ボタン */
  .plus { position:fixed; top:22px; right:26px; z-index:20; width:52px; height:52px; padding:0; display:grid; place-items:center; border-radius:50%; cursor:pointer; color:var(--accent); transition:transform .2s, box-shadow .2s; }
  .plus:hover { transform:scale(1.07) rotate(90deg); }
  .plus:active { transform:scale(.96); }
  .plus svg { width:24px; height:24px; }

  /* 部品 */
  h2 { font-size:1.35rem; margin:0; letter-spacing:-.01em; }
  h3 { font-size:1.02rem; margin:0; }
  .muted { color:var(--muted); }
  .lead { color:var(--muted); font-size:.9rem; margin:4px 0 0; }
  .card { padding:20px 22px; }
  .hero { display:flex; align-items:center; gap:14px; padding:16px 22px; margin-right:66px; }
  .avatar { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:1.15rem; color:#fff; background:linear-gradient(135deg,#5ac8fa,#0a84ff 55%,#bf5af2); box-shadow:0 4px 14px rgba(10,132,255,.4); flex:none; }
  .hero-sub { font-size:.74rem; color:var(--muted); line-height:1.2; }
  .hero-name { font-size:1.35rem; font-weight:700; letter-spacing:-.01em; line-height:1.3; word-break:break-all; }
  .btn { appearance:none; border:1px solid var(--inner-line); background:var(--inner); color:var(--fg); font:inherit; font-size:.88rem; font-weight:600; padding:8px 16px; border-radius:999px; cursor:pointer; transition:transform .15s, background .2s, opacity .2s; white-space:nowrap; }
  .btn:hover { background:var(--glass-hi); }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { background:linear-gradient(180deg,var(--accent2),var(--accent)); color:#fff; border-color:transparent; box-shadow:0 4px 14px rgba(10,132,255,.35); }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn.big { padding:13px 22px; font-size:1rem; width:100%; }
  .btn.sm { padding:5px 12px; font-size:.8rem; }
  .btn.danger { color:var(--bad); }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--muted); }
  input[type=text], input:not([type]) { width:100%; font:inherit; color:var(--fg); background:var(--inner); border:1px solid var(--inner-line); border-radius:14px; padding:12px 14px; outline:none; transition:box-shadow .2s, border-color .2s; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(10,132,255,.2); }
  label { display:block; font-size:.82rem; color:var(--muted); font-weight:600; margin:0 0 6px 2px; }
  .err { color:var(--bad); font-size:.86rem; margin:10px 0 0; }
  .hint { color:var(--muted); font-size:.82rem; margin:8px 2px 0; }
  code, .mono { font-family:var(--mono); }

  /* 状態の表示 */
  .pill { display:inline-flex; align-items:center; gap:7px; padding:4px 12px 4px 10px; border-radius:999px; font-weight:700; font-size:.88rem; background:var(--inner); border:1px solid var(--inner-line); }
  .pill .dot { width:9px; height:9px; border-radius:50%; background:currentColor; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 22%, transparent); }
  .lv-quiet { color:var(--ok); } .lv-normal { color:var(--accent); } .lv-busy { color:var(--warn); } .lv-heavy { color:var(--bad); }
  .gauge { height:8px; border-radius:99px; background:var(--inner); border:1px solid var(--inner-line); overflow:hidden; }
  .gauge i { display:block; height:100%; border-radius:99px; background:currentColor; transition:width .6s cubic-bezier(.2,.8,.2,1); min-width:6px; }
  .st-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:10px; margin-top:16px; }
  .tile { background:var(--inner); border:1px solid var(--inner-line); border-radius:16px; padding:11px 14px; }
  .tile .tl { font-size:.74rem; color:var(--muted); }
  .tile .tv { font-size:1.2rem; font-weight:700; letter-spacing:-.01em; line-height:1.35; }
  .tile .ts { font-size:.72rem; color:var(--muted); }
  .chart { margin-top:16px; }
  .chart .cap { display:flex; justify-content:space-between; font-size:.74rem; color:var(--muted); margin-bottom:4px; }
  .chart svg { width:100%; height:84px; display:block; }
  .chart rect { fill:var(--bar); }

  /* プロジェクトの一覧 */
  .sect-title { display:flex; align-items:center; justify-content:space-between; margin:6px 4px 0; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .pcard { text-align:left; font:inherit; color:inherit; cursor:pointer; padding:18px 20px; display:grid; gap:8px; transition:transform .2s, box-shadow .2s; }
  .pcard:hover { transform:translateY(-3px); box-shadow:0 16px 44px rgba(40,60,120,.2), inset 0 1px 0 var(--glass-hi); }

<!-- ② 機能の呼び出し（見た目無し） -->
<script>
var GakuAcct = (function () {
  var win = null, n = 0, wait = {}, hooks = [], me = null, proof = '';
  // 「この埋め込み画面から届いた信号か」を調べる（ほかのサイトからの偽の信号は無視する）
  // GAS のページは外の枠の中にもう一つ枠がある二重の作りなので、枠の中の窓まで調べる
  function inTree(w, src, depth) {
    if (depth > 3) return false;
    var n = 0; try { n = w.frames.length; } catch (x) {}
    for (var i = 0; i < n; i++) {
      var c = null; try { c = w.frames[i]; } catch (x) {}
      if (c && (c === src || inTree(c, src, depth + 1))) return true;
    }
    return false;
  }
  function mine(src) {
    var fs = document.querySelectorAll('iframe');
    for (var i = 0; i < fs.length; i++) {
      var w = fs[i].contentWindow;
      if (w && (w === src || inTree(w, src, 0))) return true;
    }
    return false;
  }
  function fire(d) { hooks.forEach(function (f) { try { f(d); } catch (x) { console.error(x); } }); }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || !mine(e.source)) return;
    if (d.type === 'gakuacct') {
      win = e.source;
      if (d.event === 'login') { me = d; proof = ''; }
      else if (d.event === 'update' && me) { for (var k in d) { if (k !== 'type' && k !== 'event') me[k] = d[k]; } }
      else if (d.event === 'proof') { proof = d.code || ''; if (me) me.code = proof; }
      else if (d.event === 'logout') { me = null; proof = ''; }
      fire(d);
    } else if (d.type === 'gakuacct-result' && wait[d.id]) { wait[d.id](d.result); delete wait[d.id]; }
  });
  // 読み込まれたあとに、いまの状態（ログイン中か）を、埋め込み画面に聞く（信号を取りこぼさないため）
  function each(w, depth) {
    if (!w || depth > 3) return;
    try { w.postMessage({ type: 'gakuacct-hello' }, '*'); } catch (x) {}
    var n = 0; try { n = w.frames.length; } catch (x) {}
    for (var i = 0; i < n; i++) { try { each(w.frames[i], depth + 1); } catch (x) {} }
  }
  function hello() {
    var fs = document.querySelectorAll('iframe');
    for (var i = 0; i < fs.length; i++) { each(fs[i].contentWindow, 0); }
  }
  [800, 2500, 6000].forEach(function (t) { setTimeout(function () { if (!win) hello(); }, t); });
  window.addEventListener('load', hello);
  return {
    // すべての信号を受け取る。d.event：ready / login / proof / update / logout
    on: function (f) { hooks.push(f); },
    // ログインした瞬間に呼ばれる（すでにログイン中なら、すぐに呼ばれる）。d.via：'password'（パスワード）/ 'saved'（保存された情報）/ 'resume'
    onLogin: function (f) {
      hooks.push(function (d) { if (d.event === 'login') f(d); });
      if (me) f(me);
    },
    // ログアウトしたときに呼ばれる
    onLogout: function (f) { hooks.push(function (d) { if (d.event === 'logout') f(d); }); },
    // いまログインしている人の情報（いなければ null）
    user: function () { return me; },
    // 本人確認用の確認コード（届いていなければ ''）
    code: function () { return proof; },
    // 機能を、見た目なしで呼び出す
    call: function (fn, args) {
      return new Promise(function (ok) {
        if (!win) { ok({ ok: false, code: 'wait', message: 'GAKU acct がまだ読み込まれていません。' }); return; }
        var id = ++n, t = setTimeout(function () { delete wait[id]; ok({ ok: false, code: 'timeout', message: '時間切れです。' }); }, 90000);
        wait[id] = function (r) { clearTimeout(t); ok(r); };
        win.postMessage({ type: 'gakuacct-call', id: id, fn: fn, args: args || [] }, '*');
      });
    }
  };
})();
</script>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const BASE = location.origin;

  // ブラウザのタブのアイコンを、左上のロゴにも使う
  try { const ic = document.querySelector('link[rel="icon"]'); if (ic) $("brandIcon").src = ic.href; } catch {}

  // ======== 状態 ========
  const S = {
    user: null, token: "", view: "home", pid: null, tab: "keys", dtab: "data",
    projects: null, project: null, status: null, pstats: null,
    revealed: new Set(), dataObj: null, filesArr: null, renaming: false, loadErr: "",
  };
  let dataKeys = []; // 画面に出しているデータのキー名 (削除ボタン用)

  // ======== 表示用の関数 ========
  const fmtBytes = (n) => {
    if (n == null) return "-";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  };
  const fmtTime = (ms) => (ms ? new Date(ms).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "まだありません");
  const fmtDate = (ms) => new Date(ms).toLocaleDateString("ja-JP", { year: "numeric", month: "numeric", day: "numeric" });
  const fmtUp = (s) => {
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return d ? `${d}日 ${h}時間` : h ? `${h}時間 ${m}分` : m ? `${m}分` : `${s}秒`;
  };
  const num = (n) => Number(n || 0).toLocaleString("ja-JP");
  const projectUrl = (p) => `${BASE}/p/${p.id}`;
  const mask = (v) => v.slice(0, 3) + "•".repeat(14) + v.slice(-4);
  const initial = (name) => Array.from(String(name || "?"))[0] || "?";

  function bars(series, label) {
    const max = Math.max(5, ...series);
    const w = 600, h = 100, n = series.length, bw = w / n;
    const rects = series.map((v, i) => {
      const bh = v ? Math.max(3, (v / max) * (h - 4)) : 1.5;
      return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="2"${v ? "" : ' opacity=".25"'}/>`;
    }).join("");
    return `<div class="chart"><div class="cap"><span>${esc(label)}</span><span>最大 ${num(Math.max(...series))} 件/分</span></div><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${rects}</svg><div class="cap"><span>60分前</span><span>いま</span></div></div>`;
  }
  function miniBars(series) {
    const max = Math.max(3, ...series.slice(-30));
    const s = series.slice(-30), w = 300, h = 60, bw = w / s.length;
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">` + s.map((v, i) => {
      const bh = v ? Math.max(3, (v / max) * (h - 2)) : 1.5;
      return `<rect x="${(i * bw + .8).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 1.6).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5"${v ? "" : ' opacity=".25"'}/>`;
    }).join("") + `</svg>`;
  }
  const tile = (l, v, s) => `<div class="tile"><div class="tl">${esc(l)}</div><div class="tv">${v}</div>${s ? `<div class="ts">${s}</div>` : ""}</div>`;

  function statusCard(st) {
    if (!st) return `<div class="loading">読み込み中…</div>`;
    const used = st.limitBytes ? `${fmtBytes(st.usedBytes)} / ${fmtBytes(st.limitBytes)}` : fmtBytes(st.usedBytes);
    return `
      <div class="st-head lv-${st.level}">
        <span class="pill"><i class="dot"></i>${esc(st.label)}</span>
        <span class="muted" style="font-size:.82rem">混み具合 ${st.score} / 100</span>
      </div>
      <div class="gauge lv-${st.level}"><i style="width:${Math.max(3, st.score)}%"></i></div>
      <div class="tiles">
        ${tile("リクエスト (直近1分)", num(st.reqLastMin), "件")}
        ${tile("平均の応答時間", num(st.avgMs) + " ms", "直近5分")}
        ${tile("接続中のリアルタイム通信", num(st.clients), "人・台")}
        ${tile("処理中のリクエスト", num(st.activeReqs), "件")}
        ${tile("処理の遅れ", num(st.lagMs) + " ms", st.lagMs < 20 ? "余裕あり" : st.lagMs < 80 ? "少し忙しい" : "忙しい")}
        ${tile("リクエスト (1時間)", num(st.reqLastHour), "件")}
        ${tile("リクエスト (24時間)", num(st.req24h), "件")}
        ${tile("稼働時間", fmtUp(st.uptimeSec), "起動してから")}
        ${tile("メモリ", num(st.rssMB) + " MB", "使用中")}
        ${tile("プロジェクト数", num(st.projects), "サーバー全体")}
        ${tile("画像・動画の容量", used, st.maxFileBytes ? "1ファイル " + fmtBytes(st.maxFileBytes) + " まで" : "")}
      </div>
      ${bars(st.series, "リクエスト数 (1分ごと・直近60分)")}
      <p class="hint">混み具合は、処理の遅れ・1分あたりのリクエスト数・接続数・処理中の数から計算しています。集計は、サーバーが起動してからの分です。</p>`;
  }

  function miniPanel(st) {
    if (!st) return `<div class="mini-head"><span>サーバー情報</span></div><div class="muted" style="font-size:.8rem">読み込み中…</div>`;
    return `
      <div class="mini-head"><span>サーバー情報</span><span>詳しく ›</span></div>
      <div class="lv-${st.level}"><span class="pill"><i class="dot"></i>${esc(st.label)}</span></div>
      <div class="gauge lv-${st.level}"><i style="width:${Math.max(3, st.score)}%"></i></div>
      <div class="mini-rows">
        <div><span class="muted">リクエスト/分</span><b>${num(st.reqLastMin)}</b></div>
        <div><span class="muted">応答時間</span><b>${num(st.avgMs)} ms</b></div>
        <div><span class="muted">接続中</span><b>${num(st.clients)}</b></div>
        <div><span class="muted">稼働</span><b>${fmtUp(st.uptimeSec)}</b></div>
      </div>
      <div class="mini-chart">${miniBars(st.series)}</div>`;
  }

  // ======== サーバーとの通信 ========
  let sessionPromise = null;
  async function ensureSession(force) {
    if (S.token && !force) return;
    if (sessionPromise) return sessionPromise;
    sessionPromise = (async () => {
      const u = acctUser || GakuAcct.user();
      if (!u) throw new Error("ログインしてください");
      diag("セッション: GAKU acct に確認コードを要求");
      const code = await freshProof();
      diag(`確認コード: ${code ? code.length + "桁を取得" : "届かなかった"}`);
      if (!code) throw new Error("GAKU acct から確認コードが届きませんでした。いったんログアウトして、もう一度ログインしてからお試しください。");
      const { code: _drop, ...user } = u;
      const r = await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user, code }) });
      const body = await r.json().catch(() => ({}));
      diag(`サーバーの応答: ${r.status}` + (r.ok ? "" : ` ${body.error || ""}`));
      if (!r.ok) throw new Error(body.error || "ログインを確認できませんでした");
      S.token = body.token;
      S.sessionName = body.name;
    })().finally(() => { sessionPromise = null; });
    return sessionPromise;
  }

  async function call(method, url, body, opts = {}) {
    await ensureSession(false);
    const run = () => fetch(url, {
      method,
      headers: { ...(body !== undefined ? { "Content-Type": "application/json" } : {}), "X-Session": S.token },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    let r = await run();
    if (r.status === 401) { // ログインの有効期限切れ (サーバーの再起動など) → 自動でやり直す
      S.token = "";
      await ensureSession(true);
      r = await run();
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || "うまくいきませんでした"); e.status = r.status; throw e; }
    return data;
  }

  // ======== 小さな通知・コピー ========
  let toastTimer = 0;
  function toast(msg, bad) {
    document.querySelectorAll(".toast").forEach((t) => t.remove());
    const t = document.createElement("div");
    t.className = "toast glass" + (bad ? " bad" : "");
    t.textContent = msg;
    document.body.append(t);
    clearTimeout(toastTimer);

  async function copyText(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);

      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.append(ta); ta.select();
      try { document.execCommand("copy"); } catch { toast("コピーできませんでした。手動で選択してコピーしてください", true); ta.remove(); return; }
      ta.remove();
    }
    toast(okMsg || "コピーしました");
  }

  function promptText(withKeys) {

      "【基本】",
      "- このプロジェクト専用のURL (ベースURL): " + PB,

      "- プロジェクト: " + p.name,
      "- 形式: すべて JSON (画像・動画のアップロードを除く)。文字コードは UTF-8。",
      "- APIキーは2種類あり、必ずヘッダーに付けます。どちらの形でも使えます。",
      "    X-API-Key: <キー>",
      "    Authorization: Bearer <キー>",
      "- Public キー (読み取り専用・公開してよい): " + PK,
      "    データと画像の一覧・取得だけができます。ブラウザで動くHTML/JavaScriptに書いてよいのは、このキーだけです。",
      "- Secret キー (読み書き・絶対に公開しない): " + SK,
      "    書き込み・削除・画像のアップロードができます。公開するHTMLやコードには書かず、サーバー側のプログラムだけで使ってください。",
      "- キーが無い・間違い・停止中のときは 401、Public キーで書き込もうとすると 403 が返ります。",
      "- 他のサイトのブラウザ(JavaScript の fetch)からも呼べます (CORS対応)。",
      "",
      "【文字・数値・JSONデータ】 名前(キー)ごとに値を1つ保存します。名前は1〜100文字。値は JSON なら何でもよく、1回のサイズは64KBまで。1プロジェクトに1000件まで。",
      "- 全部読む  (Public/Secret):  GET " + PB + "/data",
      "     → {\"名前\": {\"value\": 値, \"updatedAt\": 時刻(ミリ秒), \"updatedBy\": 更新したキーの名前}, ...}",
      "- 1つ読む   (Public/Secret):  GET " + PB + "/data/名前   (無ければ 404)",
      "- 書く       (Secret):         PUT " + PB + "/data/名前   ボディ {\"value\": 任意のJSON}  (Content-Type: application/json)",
      "- 消す       (Secret):         DELETE " + PB + "/data/名前",
      "- 名前に日本語や記号を使うときは、URLエンコードしてください。",
      "",
      "【画像・動画】 PNG / JPEG / GIF / WebP / AVIF / MP4 / MOV / WebM に対応。1ファイル最大50MB。",
      "- アップロード (Secret): POST " + PB + "/files",
      "    ボディにファイルそのもの(バイナリ)を送ります。ヘッダーに X-File-Name: URLエンコードしたファイル名 を付けます。",
      "    成功すると 201 で {\"id\", \"url\": \"/files/xxxx\", \"name\", \"type\", \"size\"} が返ります。",
      "- 表示: 返ってきた url の先頭に " + BASE + " を付けて、<img src> や <video src> に使います (例 " + BASE + "/files/xxxx)。この表示にキーは要りません。",
      "- 一覧 (Public/Secret): GET " + PB + "/files    1つの情報: GET " + PB + "/files/{id}",
      "- 削除 (Secret): DELETE " + PB + "/files/{id}",
      "- 画像をデータにも載せたいときは、アップロード後に PUT /data/名前 へ {\"value\": {\"type\": \"image\", \"url\": \"" + BASE + "/files/xxxx\", \"name\": \"ファイル名\"}} (動画は type を \"video\") と保存してください。",
      "",
      "【リアルタイムに受け取る (WebSocket・読み取り専用)】",
      "- 接続先: " + PB.replace(/^http/, "ws") + "?key=<Publicキー または Secretキー>",
      "- 接続直後に {\"type\":\"init\",\"data\":{...このプロジェクトの全データ...}} が届き、その後は更新のたびに",
      "  {\"type\":\"update\",\"key\":\"名前\",\"entry\":{\"value\":...,\"updatedAt\":...,\"updatedBy\":...}} や {\"type\":\"delete\",\"key\":\"名前\"} が届きます。",

      "【エラー】 失敗時は {\"error\": \"理由\"} が返ります。",

      "【例 (curl)】",
      "curl -X PUT " + PB + "/data/memo -H \"Content-Type: application/json\" -H \"X-API-Key: " + SK + "\" -d '{\"value\":\"こんにちは\"}'",

      "",

      "const r = await (await fetch(\"" + PB + "/data/memo\", { headers: { \"X-API-Key\": \"" + PK + "\" } })).json(); // r.value",

    ].join("\n");
  }

  async function refreshData(quiet) {

      S.dataObj = d; S.filesArr = f;
      if (changed && S.view === "project" && S.tab === "data") renderData();

  // ======== 画面の切り替え ========
  function parseHash() {
    const h = location.hash.replace(/^#\/?/, "");
    if (h === "new") return { view: "create" };
    const m = /^p\/([0-9a-f]{12})(?:\/(keys|data|info))?$/.exec(h);
    if (m) return { view: "project", pid: m[1], tab: m[2] || "keys" };
    return { view: "home" };
  }
  function go(hash) {
    if (location.hash === hash || (hash === "#/" && !location.hash)) route();
    else location.hash = hash;
  }

  async function route() {
    if (!S.user) return;
    const r = parseHash();
    const prevPid = S.pid;
    S.view = r.view;
    S.renaming = false;
    $("plusBtn").hidden = false;
    if (r.view === "project") {
      S.tab = r.tab;
      if (S.pid !== r.pid || !S.project) {
        S.pid = r.pid; S.project = null; S.pstats = null; S.dataObj = null; S.filesArr = null; S.revealed = new Set();
        renderProject();
        try {
          S.project = await call("GET", `/api/projects/${r.pid}`);
        } catch (e) {
          if (parseHash().pid !== r.pid) return;
          S.pid = null; toast(e.status === 404 ? "そのプロジェクトは見つかりません" : e.message, true);
          return go("#/");
        }
        if (parseHash().pid !== r.pid) return;
        S.pstats = S.project.stats;
        poll();
      }
      renderProject();
      if (S.tab === "data") refreshData(false);
    } else {
      S.pid = null; S.project = null;
      if (r.view === "create") renderCreate();
      else { renderHome(); loadProjects(); }
    }
  }

  async function loadProjects() {
    try {
      S.projects = await call("GET", "/api/projects");
      if (S.view === "home") renderHome();
    } catch (e) { toast(e.message, true); }
  }

  // 5秒ごとにサーバーの状態を取り直して、見えている部分だけ更新する
  async function poll() {
    if (!S.user || !S.token || document.hidden) return;
    try {
      const q = S.view === "project" && S.pid ? `?project=${S.pid}` : "";
      const r = await call("GET", "/api/status" + q);
      S.status = r.server;
      if (r.project) S.pstats = r.project;
      if ($("mini")) $("mini").innerHTML = miniPanel(S.status);
      if ($("homeStatus")) $("homeStatus").innerHTML = statusCard(S.status);
      if (S.view === "project" && S.tab === "info" && $("infoServer")) {
        $("infoServer").innerHTML = `<h3 style="margin-bottom:10px">サーバー全体の状態</h3>${statusCard(S.status)}`;
        const ip = $("infoProject");
        if (ip) { const keep = ip.scrollTop; renderInfo(); ip.scrollTop = keep; }
      }
      if (S.view === "project" && S.tab === "data") refreshData(true);
    } catch {}
  }
  setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  // ======== ボタンの動作 ========
  document.addEventListener("click", async (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    const kid = el.dataset.kid;
    try {
      if (act === "home") return go("#/");
      if (act === "new") return go("#/new");
      if (act === "open") return go(`#/p/${el.dataset.pid}/keys`);
      if (act === "tab") return go(`#/p/${S.pid}/${el.dataset.tab}`);
      if (act === "create") return createProject();
      if (act === "rename") { S.renaming = true; return renderSideTop(); }
      if (act === "renameCancel") { S.renaming = false; return renderSideTop(); }
      if (act === "renameSave") return saveRename();
      if (act === "reveal") { S.revealed.has(kid) ? S.revealed.delete(kid) : S.revealed.add(kid); return renderKeys(); }
      if (act === "copykey") { const k = S.project.keys.find((x) => x.id === kid); return copyText(k.value, k.type === "secret" ? "Secret キーをコピーしました。公開しないでください" : "Public キーをコピーしました"); }
      if (act === "togglekey") return toggleKey(kid);
      if (act === "newkey") return newKey(el.dataset.type, el);
      if (act === "copyurlbase") return copyText(projectUrl(S.project), "URLをコピーしました");
      if (act === "copyprompt") return copyText(promptText(false), "文章をコピーしました");
      if (act === "copypromptkey") return copyText(promptText(true), "キー入りの文章をコピーしました。他の人には見せないでください");
      if (act === "dtab") { S.dtab = el.dataset.d; return renderData(); }
      if (act === "refresh") { await refreshData(false); return toast("更新しました"); }
      if (act === "copyurl") return copyText(BASE + "/files/" + el.dataset.id, "URLをコピーしました");
      if (act === "delentry") {
        const key = dataKeys[Number(el.dataset.i)];
        if (key == null || !confirm(`「${key}」を削除しますか?`)) return;
        await call("DELETE", `/api/projects/${S.pid}/data/${encodeURIComponent(key)}`);
        toast("削除しました"); return refreshData(false);
      }
      if (act === "delfile") {
        if (!confirm("この画像・動画を削除しますか? 元に戻せません")) return;
        await call("DELETE", `/api/projects/${S.pid}/files/${el.dataset.id}`);
        toast("削除しました"); return refreshData(false);
      }
    } catch (err) { toast(err.message, true); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "newName") { e.preventDefault(); createProject(); }
    else if (e.key === "Enter" && e.target.id === "renameInput") { e.preventDefault(); saveRename(); }
    else if (e.key === "Escape" && e.target.id === "renameInput") { S.renaming = false; renderSideTop(); }
    else if ((e.key === "Enter" || e.key === " ") && e.target.id === "mini") { e.preventDefault(); go(`#/p/${S.pid}/info`); }
  });

  async function createProject() {
    const btn = $("createBtn"), err = $("createErr");
    err.hidden = true; btn.disabled = true; btn.textContent = "作成中…";
    try {
      const p = await call("POST", "/api/projects", { name: $("newName").value });
      S.projects = null;
      toast("プロジェクトを作成しました");
      S.project = null; S.pid = null;
      go(`#/p/${p.id}/keys`);
    } catch (e) {
      err.textContent = e.message; err.hidden = false;
      btn.disabled = false; btn.textContent = "プロジェクトを作成";
    }
  }

  async function saveRename() {
    const name = $("renameInput").value.trim();
    if (!name) return toast("プロジェクト名を入力してください", true);
    try {
      const p = await call("PATCH", `/api/projects/${S.pid}`, { name });
      S.project = p; S.renaming = false; S.projects = null;
      renderSideTop();
      if (S.tab === "keys") renderKeys();
      toast("名前を変えました");
    } catch (e) { toast(e.message, true); }
  }

  async function toggleKey(kid) {
    const k = S.project.keys.find((x) => x.id === kid);
    if (k.active && !confirm(`このキーを停止しますか?\nこのキーを使っているプログラムやサイトは、すぐに動かなくなります。(あとで再開できます)`)) return;
    const rec = await call("PATCH", `/api/projects/${S.pid}/keys/${kid}`, { active: !k.active });
    Object.assign(k, rec);
    renderKeys();
    toast(rec.active ? "キーを再開しました" : "キーを停止しました");
  }

  async function newKey(type, btn) {
    btn.disabled = true;
    try {
      const rec = await call("POST", `/api/projects/${S.pid}/keys`, { type });
      S.project.keys.push(rec);
      S.revealed.add(rec.id);
      renderKeys();
      toast(`新しい${type === "secret" ? "Secret" : "Public"}キーを作成しました`);
    } finally { btn.disabled = false; }
  }

  // ======== アカウント連携 (GAKU acct) ========
  function userLabel(u) {
    return u && (u.name || u.email || u.id) ? String(u.name || u.email || u.id) : "ログイン中";
  }

  let acctUser = null; // ログイン中のアカウント情報

  function showLogin(u) {
    const same = acctUser && userLabel(acctUser) === userLabel(u) && S.user;
    acctUser = u;
    if (same) return;
    S.user = u; S.token = ""; S.projects = null; S.project = null; S.pid = null; S.status = null;
    renderHero();
    $("shell").classList.remove("solo");
    $("stage").hidden = false;
    $("plusBtn").hidden = false;
    $("view").innerHTML = `<div class="loading">アカウントを確認しています…</div>`;
    enter();
  }
  function hideLogin() {
    acctUser = null; rawProof = "";
    S.user = null; S.token = ""; S.projects = null; S.project = null; S.pid = null; S.status = null;
    $("stage").hidden = true;
    $("plusBtn").hidden = true;
    $("shell").classList.add("solo");
    $("view").innerHTML = "";
  }

  async function enter() {
    try {
      await ensureSession(false);
      await poll();
      await route();
    } catch (e) {
      $("view").innerHTML = `<section class="glass card" style="max-width:560px"><h3>ログインを確認できませんでした</h3><p class="err" style="margin-top:8px">${esc(e.message)}</p><div style="margin-top:14px"><button class="btn primary" id="retryBtn">もう一度やってみる</button></div></section>`;
      $("retryBtn").onclick = () => { $("view").innerHTML = `<div class="loading">アカウントを確認しています…</div>`; enter(); };
    }
  }
  window.addEventListener("hashchange", route);

  GakuAcct.onLogin(showLogin);
  GakuAcct.onLogout(hideLogin);

  // 確認コードは5分で期限切れ&1回しか使えないので、使う直前に GAKU acct から新しいコードをもらう
  let proofWaiter = null;
  let rawProof = "", rawProofAt = 0; // 届いた確認コード (まだ使っていないもの)
  let gakuSource = null;             // GAKU acct が実際にメッセージを送ってきた窓
  let otherSeen = 0;                 // 診断用: GAKU acct 以外のメッセージを記録した数

  function inTree(w, src, depth) {
    if (depth > 6) return false;
    let n = 0; try { n = w.frames.length; } catch {}
    for (let i = 0; i < n; i++) {
      let c = null; try { c = w.frames[i]; } catch {}
      if (c && (c === src || inTree(c, src, depth + 1))) return true;
    }
    return false;
  }
  function fromMyFrames(src) {
    for (const f of document.querySelectorAll("iframe")) {
      const w = f.contentWindow;
      if (w && (w === src || inTree(w, src, 0))) return true;
    }
    return false;
  }

  // GAKU acct 宛てのメッセージを、判定の前の生の状態で受け取る。
  // 確認コードは、サーバーが GAKU PAY に問い合わせて本物か確かめるので、送信元の判定に頼らず受け取ってよい。
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || typeof d !== "object" || d.type !== "gakuacct") {
      if (otherSeen < 30 && !$("diagbox").hidden) {
        otherSeen++;
        let kind = typeof d;
        if (d && typeof d === "object") kind = "type=" + String(d.type) + " keys=" + Object.keys(d).slice(0, 5).join(",");
        diag(`その他の受信: ${kind} / 送信元 ${e.origin || "?"}`);
      }
      return;
    }
    const code = String(d.code || "");
    if (e.source) gakuSource = e.source;
    diag(`受信: ${d.event}` + (d.event === "proof" ? ` (確認コード ${code.length}桁)` : "") +
      ` / 送信元 ${e.origin || "?"} / 埋め込み画面の中: ${fromMyFrames(e.source) ? "はい" : "いいえ"}`);
    if (d.event === "proof" && /^[0-9a-f]{64}$/.test(code)) {
      if (proofWaiter) { const f = proofWaiter; proofWaiter = null; f(code); }
      else { rawProof = code; rawProofAt = Date.now(); }
    }
    // ログイン・ログアウトも、送信元の判定に頼らず受け取る。
    // (偽の知らせで画面が出ても、サーバーが確認コードを検証しない限り、何も作れない・見られないので安全)
    if (d.event === "login") showLogin(d);
    if (d.event === "logout") hideLogin();
  });
  function askProof() {
    if (gakuSource) {
      try { gakuSource.postMessage({ type: "gakuacct-hello" }, "*"); diag("問い合わせ: 送ってきた窓へ直接送信"); return; }
      catch (err) { diag(`問い合わせ: 直接送信に失敗 (${err.message})`); }
    }
    let reached = 0;
    const levels = [];
    const ask = (w, depth) => {
      if (!w || depth > 6) return;
      try { w.postMessage({ type: "gakuacct-hello" }, "*"); reached++; } catch {}
      let n = 0; try { n = w.frames.length; } catch {}
      levels[depth] = (levels[depth] || 0) + 1;
      for (let i = 0; i < n; i++) { try { ask(w.frames[i], depth + 1); } catch {} }
    };
    document.querySelectorAll("iframe").forEach((f) => ask(f.contentWindow, 0));
    diag(`問い合わせた窓: ${reached}個 (階層ごと: ${levels.join(" / ") || "なし"})`);
  }
  function freshProof() {
    return new Promise((resolve) => {
      if (rawProof && Date.now() - rawProofAt < 240000) {
        const c = rawProof; rawProof = "";
        return resolve(c);
      }
      rawProof = "";
      proofWaiter = resolve;
      askProof();
      setTimeout(() => {
        if (proofWaiter !== resolve) return;
        GakuAcct.call("proof").then((r) => {
          const ok = r && r.ok && /^[0-9a-f]{64}$/.test(String(r.code || ""));
          diag(`直接呼び出し(proof): ${ok ? "成功" : "失敗 " + ((r && (r.message || r.code)) || "")}`);
          if (ok && proofWaiter === resolve) { proofWaiter = null; resolve(r.code); }
        });
      }, 3000);
      setTimeout(() => { if (proofWaiter === resolve) { proofWaiter = null; resolve(""); } }, 15000);
    });
  }

  // ---- 診断情報 (困ったときに見せてもらうための記録。確認コードやキーそのものは記録しない) ----
  const diagBox = $("diag");
  // 普段は見えない。アドレスの末尾に ?diag=1 を付けて開いたときだけ表示する
  if (new URLSearchParams(location.search).get("diag") === "1") $("diagbox").hidden = false;
  function diag(text) {
    diagBox.textContent += `${new Date().toLocaleTimeString("ja-JP")}  ${text}\n`;
  }
  function treeShape() {
    const levels = [];
    const walk = (w, depth) => {
      if (!w || depth > 8) return;
      levels[depth] = (levels[depth] || 0) + 1;
      let n = 0; try { n = w.frames.length; } catch {}
      for (let i = 0; i < n; i++) { try { walk(w.frames[i], depth + 1); } catch {} }
    };
    document.querySelectorAll("iframe").forEach((f) => walk(f.contentWindow, 0));
    return levels.join(" / ") || "なし";
  }
  document.querySelectorAll("iframe").forEach((f) => f.addEventListener("load", () => diag(`枠の読み込みが完了 (窓の階層: ${treeShape()})`)));
  [3000, 8000].forEach((ms) => setTimeout(() => diag(`${ms / 1000}秒後: 窓の階層 ${treeShape()} / GAKU acct からの受信 ${gakuSource ? "あり" : "なし"}`), ms));
})();
</script>
</body>
</html>
