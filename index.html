<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --fg:#e8ebf2; --muted:#98a2b3; --accent:#6ea0ff; --line:#2a3140; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:1.4rem; margin:0; }
  .status { font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ef4444; }
  .dot.on { background:#22c55e; }
  form { display:flex; gap:8px; margin:20px 0; flex-wrap:wrap; }
  input { flex:1 1 140px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); padding:4px 8px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  li .k { font-weight:600; }
  li .meta, .meta { font-size:.75rem; color:var(--muted); }
  li img, li video { display:block; max-width:100%; max-height:320px; border-radius:8px; margin:6px 0; }
  li > div:first-child { min-width:0; }
  li.flash { animation: flash 1s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 25%, var(--card)); } to { background:var(--card); } }
  .empty { color:var(--muted); text-align:center; padding:32px 0; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:20px 0; }
  .panel h2 { font-size:1rem; margin:0 0 10px; }
  .panel iframe { display:block; margin:0 auto; }
  .keybox { margin-top:12px; display:grid; gap:8px; }
  .keybox code { display:block; padding:10px 12px; border-radius:8px; background:var(--bg); border:1px solid var(--line); word-break:break-all; font-size:.85rem; }
  .keybox .note { font-size:.8rem; color:var(--muted); margin:0; }
  .diagbox { margin-top:32px; font-size:.8rem; color:var(--muted); }
  .diagbox pre { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-height:2.5em; }
  .keybox .err { font-size:.85rem; color:#ef4444; margin:0; }
</style>

<!-- ② 機能の呼び出し（見た目無し） -->
<script>
var GakuAcct = (function () {
  var win = null, n = 0, wait = {}, hooks = [], me = null, proof = '';
  // 「この埋め込み画面から届いた信号か」を調べる（ほかのサイトからの偽の信号は無視する）
  // GAS のページは外の枠の中にもう一つ枠がある二重の作りなので、枠の中の窓まで調べる
  function inTree(w, src, depth) {
    if (depth > 3) return false;
    var n = 0; try { n = w.frames.length; } catch (x) {}
    for (var i = 0; i < n; i++) {
      var c = null; try { c = w.frames[i]; } catch (x) {}
      if (c && (c === src || inTree(c, src, depth + 1))) return true;
    }
    return false;
  }
  function mine(src) {
    var fs = document.querySelectorAll('iframe');
    for (var i = 0; i < fs.length; i++) {
      var w = fs[i].contentWindow;
      if (w && (w === src || inTree(w, src, 0))) return true;
    }
    return false;
  }
  function fire(d) { hooks.forEach(function (f) { try { f(d); } catch (x) { console.error(x); } }); }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || !mine(e.source)) return;
    if (d.type === 'gakuacct') {
      win = e.source;
      if (d.event === 'login') { me = d; proof = ''; }
      else if (d.event === 'update' && me) { for (var k in d) { if (k !== 'type' && k !== 'event') me[k] = d[k]; } }
      else if (d.event === 'proof') { proof = d.code || ''; if (me) me.code = proof; }
      else if (d.event === 'logout') { me = null; proof = ''; }
      fire(d);
    } else if (d.type === 'gakuacct-result' && wait[d.id]) { wait[d.id](d.result); delete wait[d.id]; }
  });
  // 読み込まれたあとに、いまの状態（ログイン中か）を、埋め込み画面に聞く（信号を取りこぼさないため）
  function each(w, depth) {
    if (!w || depth > 3) return;
    try { w.postMessage({ type: 'gakuacct-hello' }, '*'); } catch (x) {}
    var n = 0; try { n = w.frames.length; } catch (x) {}
    for (var i = 0; i < n; i++) { try { each(w.frames[i], depth + 1); } catch (x) {} }
  }
  function hello() {
    var fs = document.querySelectorAll('iframe');
    for (var i = 0; i < fs.length; i++) { each(fs[i].contentWindow, 0); }
  }
  [800, 2500, 6000].forEach(function (t) { setTimeout(function () { if (!win) hello(); }, t); });
  window.addEventListener('load', hello);
  return {
    // すべての信号を受け取る。d.event：ready / login / proof / update / logout
    on: function (f) { hooks.push(f); },
    // ログインした瞬間に呼ばれる（すでにログイン中なら、すぐに呼ばれる）。d.via：'password'（パスワード）/ 'saved'（保存された情報）/ 'resume'
    onLogin: function (f) {
      hooks.push(function (d) { if (d.event === 'login') f(d); });
      if (me) f(me);
    },
    // ログアウトしたときに呼ばれる
    onLogout: function (f) { hooks.push(function (d) { if (d.event === 'logout') f(d); }); },
    // いまログインしている人の情報（いなければ null）
    user: function () { return me; },
    // 本人確認用の確認コード（届いていなければ ''）
    code: function () { return proof; },
    // 機能を、見た目なしで呼び出す
    call: function (fn, args) {
      return new Promise(function (ok) {
        if (!win) { ok({ ok: false, code: 'wait', message: 'GAKU acct がまだ読み込まれていません。' }); return; }
        var id = ++n, t = setTimeout(function () { delete wait[id]; ok({ ok: false, code: 'timeout', message: '時間切れです。' }); }, 90000);
        wait[id] = function (r) { clearTimeout(t); ok(r); };
        win.postMessage({ type: 'gakuacct-call', id: id, fn: fn, args: args || [] }, '*');
      });
    }
  };
})();
</script>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ---- アカウント連携: ログインしたらAPIキーを発行できる ----
  const keybox = $("keybox"), keyErr = $("keyErr"), keyResult = $("keyResult");

  function userLabel(u) {
    return u && (u.name || u.email || u.id) ? String(u.name || u.email || u.id) : "ログイン中";
  }

  let acctUser = null; // ログイン中のアカウント情報

  function showLogin(u) {
    acctUser = u;
    $("whoami").textContent = `${userLabel(u)} としてログイン中`;
    keybox.hidden = false;
  }
  function hideLogin() {
    acctUser = null;
    rawProof = "";
    keybox.hidden = true;
    keyResult.hidden = true;
    keyErr.hidden = true;
    $("keyValue").textContent = "";
  }
  GakuAcct.onLogin(showLogin);
  GakuAcct.onLogout(hideLogin);

  // 確認コードは5分で期限切れ&1回しか使えないので、発行の直前に GAKU acct から新しいコードをもらう
  let proofWaiter = null;
  let rawProof = "", rawProofAt = 0; // 届いた確認コード (まだ使っていないもの)
  let gakuSource = null;             // GAKU acct が実際にメッセージを送ってきた窓
  let otherSeen = 0;                 // 診断用: GAKU acct 以外のメッセージを記録した数

  // 埋め込み画面の中から届いたメッセージか (診断用)
  function inTree(w, src, depth) {
    if (depth > 6) return false;
    let n = 0; try { n = w.frames.length; } catch {}
    for (let i = 0; i < n; i++) {
      let c = null; try { c = w.frames[i]; } catch {}
      if (c && (c === src || inTree(c, src, depth + 1))) return true;
    }
    return false;
  }
  function fromMyFrames(src) {
    for (const f of document.querySelectorAll("iframe")) {
      const w = f.contentWindow;
      if (w && (w === src || inTree(w, src, 0))) return true;
    }
    return false;
  }

  // GAKU acct 宛てのメッセージを、判定の前の生の状態で受け取る。
  // 確認コードは、サーバーが GAKU PAY に問い合わせて本物か確かめるので、送信元の判定に頼らず受け取ってよい。
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || typeof d !== "object" || d.type !== "gakuacct") {
      // 診断: GAKU acct 以外のメッセージも、何が届いているか記録する (多すぎないよう30件まで)
      if (otherSeen < 30 && !$("diagbox").hidden) {
        otherSeen++;
        let kind = typeof d;
        if (d && typeof d === "object") kind = "type=" + String(d.type) + " keys=" + Object.keys(d).slice(0, 5).join(",");
        diag(`その他の受信: ${kind} / 送信元 ${e.origin || "?"}`);
      }
      return;
    }
    const code = String(d.code || "");
    if (e.source) gakuSource = e.source; // 実際に送ってきた窓 (こちらからの問い合わせは、ここへ直接送れる)
    diag(`受信: ${d.event}` + (d.event === "proof" ? ` (確認コード ${code.length}桁)` : "") +
      ` / 送信元 ${e.origin || "?"} / 埋め込み画面の中: ${fromMyFrames(e.source) ? "はい" : "いいえ"}`);
    if (d.event === "proof" && /^[0-9a-f]{64}$/.test(code)) {
      if (proofWaiter) { const f = proofWaiter; proofWaiter = null; f(code); }
      else { rawProof = code; rawProofAt = Date.now(); }
    }
    // ログイン・ログアウトも、送信元の判定に頼らず受け取る。
    // (偽の知らせでボタンが出ても、キーはサーバーが確認コードを検証してからしか発行しないので安全)
    if (d.event === "login") showLogin(d);
    if (d.event === "logout") hideLogin();
  });
  function askProof() {
    // 送ってきた窓が分かっているときは、そこへ直接問い合わせる (窓をたどるより確実)
    if (gakuSource) {
      try { gakuSource.postMessage({ type: "gakuacct-hello" }, "*"); diag("問い合わせ: 送ってきた窓へ直接送信"); return; }
      catch (err) { diag(`問い合わせ: 直接送信に失敗 (${err.message})`); }
    }
    let reached = 0;
    const levels = [];
    const ask = (w, depth) => {
      if (!w || depth > 6) return;
      try { w.postMessage({ type: "gakuacct-hello" }, "*"); reached++; } catch {}
      let n = 0; try { n = w.frames.length; } catch {}
      levels[depth] = (levels[depth] || 0) + 1;
      for (let i = 0; i < n; i++) { try { ask(w.frames[i], depth + 1); } catch {} }
    };
    document.querySelectorAll("iframe").forEach((f) => ask(f.contentWindow, 0));
    diag(`問い合わせた窓: ${reached}個 (階層ごと: ${levels.join(" / ") || "なし"})`);
  }
  function freshProof() {
    return new Promise((resolve) => {
      // ログイン直後に届いた新しいコードがあれば、それを使う (コードは5分・1回だけ有効)
      if (rawProof && Date.now() - rawProofAt < 240000) {
        const c = rawProof; rawProof = "";
        return resolve(c);
      }
      rawProof = "";
      proofWaiter = resolve;
      askProof();

      // 知らせが届かないときの別ルート: GAKU acct に「確認コードをください」と直接呼び出す
      // (GAKU PAY 側の ACCT_FN に proof が登録されている場合だけ使える)
      setTimeout(() => {
        if (proofWaiter !== resolve) return;
        GakuAcct.call("proof").then((r) => {
          const ok = r && r.ok && /^[0-9a-f]{64}$/.test(String(r.code || ""));
          diag(`直接呼び出し(proof): ${ok ? "成功" : "失敗 " + ((r && (r.message || r.code)) || "")}`);
          if (ok && proofWaiter === resolve) { proofWaiter = null; resolve(r.code); }
        });
      }, 3000);

      // GAKU PAY (Google) の起動が遅いことがあるので、少し長めに待つ
      setTimeout(() => { if (proofWaiter === resolve) { proofWaiter = null; resolve(""); } }, 15000);
    });
  }

  // ---- 診断情報 (困ったときに見せてもらうための記録。確認コードやキーそのものは記録しない) ----
  const diagBox = $("diag");
  // 普段は見えない。アドレスの末尾に ?diag=1 を付けて開いたときだけ表示する
  if (new URLSearchParams(location.search).get("diag") === "1") $("diagbox").hidden = false;
  function diag(text) {
    const t = new Date().toLocaleTimeString("ja-JP");
    diagBox.textContent += `${t}  ${text}\n`;
  }

  // 診断: 埋め込み枠の読み込み完了と、窓の入れ子の深さを記録する
  function treeShape() {
    const levels = [];
    const walk = (w, depth) => {
      if (!w || depth > 8) return;
      levels[depth] = (levels[depth] || 0) + 1;
      let n = 0; try { n = w.frames.length; } catch {}
      for (let i = 0; i < n; i++) { try { walk(w.frames[i], depth + 1); } catch {} }
    };
    document.querySelectorAll("iframe").forEach((f) => walk(f.contentWindow, 0));
    return levels.join(" / ") || "なし";
  }
  document.querySelectorAll("iframe").forEach((f) => f.addEventListener("load", () => diag(`枠の読み込みが完了 (窓の階層: ${treeShape()})`)));
  [3000, 8000].forEach((ms) => setTimeout(() => diag(`${ms / 1000}秒後: 窓の階層 ${treeShape()} / GAKU acct からの受信 ${gakuSource ? "あり" : "なし"}`), ms));

  $("issueKey").addEventListener("click", async () => {
    keyErr.hidden = true;
    const u = acctUser || GakuAcct.user();
    if (!u) { keyErr.textContent = "ログインしてください。"; keyErr.hidden = false; return; }
    const { code: _drop, ...user } = u;
    $("issueKey").disabled = true;
    $("issueKey").textContent = "確認中…";
    try {
      diag("発行ボタンが押された。GAKU acct に確認コードを要求");
      const code = await freshProof();
      diag(`確認コード: ${code ? code.length + "桁を取得" : "届かなかった"}`);
      if (!code) {
        throw new Error("GAKU acct から確認コードが届きませんでした。いったんログアウトして、もう一度ログインしてからお試しください。それでも出ない場合は、下の「診断情報」を教えてください。");
      }
      const r = await fetch("/api/keys", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user, code }),
      });
      const body = await r.json();
      diag(`サーバーの応答: ${r.status}` + (r.ok ? "" : ` ${body.error || ""}`));
      if (!r.ok) throw new Error(body.error || "発行に失敗しました");
      $("keyValue").textContent = body.key;
      keyResult.hidden = false;
    } catch (e) {
      keyErr.textContent = e.message;
      keyErr.hidden = false;
    } finally {
      $("issueKey").disabled = false;
      $("issueKey").textContent = "APIキーを発行する";
    }
  });

  $("copyKey").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("keyValue").textContent);
      $("copyKey").textContent = "コピーしました";
      setTimeout(() => ($("copyKey").textContent = "コピー"), 1500);
    } catch {
      keyErr.textContent = "コピーできませんでした。手動で選択してコピーしてください。";
      keyErr.hidden = false;
    }
  });

})();
</script>
</body>
</html>
